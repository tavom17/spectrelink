services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      API_URL: ${API_GATEWAY_URL}
    command: npm run dev
    networks:
      - app

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    volumes:
      - ./api-gateway/src:/app/src
      - ./certs/ca-wallet-certificate.crt:/app/certs/db-ca.crt:ro
    ports:
      - "3001:3001"
    environment:
      DB_HOST: ${OMNIA_WALLET_DB_HOST}
      DB_PORT: ${OMNIA_WALLET_DB_PORT}
      DB_USER: ${OMNIA_WALLET_DB_USER}
      DB_PASSWORD: ${OMNIA_WALLET_DB_PASSWORD}
      DB_NAME: ${OMNIA_WALLET_DB_NAME}
      DB_SSL_CA_PATH: /app/certs/db-ca.crt
      REDIS_URL: ${REDIS_URL}
      REGISTRATION_SECRET: ${registration_secret}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WALLET_APP_URL: ${WALLET_APP_URL}
      LIQUIDITY_APP_URL: ${LIQUIDITY_APP_URL}
      COIN_APP_URL: ${COIN_APP_URL}
    depends_on:
      redis-dev:
        condition: service_started
    networks:
      - app
      - data

  liquidity-manager:
    build:
      context: ./liquidity-manager
      dockerfile: Dockerfile
    volumes:
      - ./liquidity-manager/src:/app/src
      - ./certs/ca-core-certificate.crt:/app/certs/db-ca.crt:ro
    ports:
      - "3004:3004"
    environment:
      DB_HOST: ${OMNIA_CORE_DB_HOST}
      DB_PORT: ${OMNIA_CORE_DB_PORT}
      DB_USER: ${OMNIA_CORE_DB_USER}
      DB_PASSWORD: ${OMNIA_CORE_DB_PASSWORD}
      DB_NAME: ${OMNIA_CORE_DB_NAME}
      DB_SSL_CA_PATH: /app/certs/db-ca.crt
      HELIUS_RPC_URL: ${HELIUS_RPC_URL}
      WALLET_APP_URL: ${WALLET_APP_URL}
    networks:
      - app
      - data

  wallet-app:
    build:
      context: ./wallet-app
      dockerfile: Dockerfile
    volumes:
      - ./wallet-app/src:/app/src
      - ./certs/ca-wallet-certificate.crt:/app/certs/db-ca.crt:ro
    ports:
      - "3003:3003"
    environment:
      DB_HOST: ${OMNIA_WALLET_DB_HOST}
      DB_PORT: ${OMNIA_WALLET_DB_PORT}
      DB_USER: ${OMNIA_WALLET_DB_USER}
      DB_PASSWORD: ${OMNIA_WALLET_DB_PASSWORD}
      DB_NAME: ${OMNIA_WALLET_DB_NAME}
      DB_SSL_CA_PATH: /app/certs/db-ca.crt
      REDIS_URL: ${REDIS_URL}
      ENCRYPTION_KEY: ${encryption_key}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL}
      HELIUS_WS_URL: ${HELIUS_WS_URL}
    depends_on:
      redis-dev:
        condition: service_started
    networks:
      - app
      - data

  coin-launcher:
    build:
      context: ./coin-launcher
      dockerfile: Dockerfile
    volumes:
      - ./coin-launcher/src:/app/src
      - ./certs/ca-wallet-certificate.crt:/app/certs/db-ca.crt:ro
    ports:
      - "3002:3002"
    environment:
      DB_HOST: ${OMNIA_WALLET_DB_HOST}
      DB_PORT: ${OMNIA_WALLET_DB_PORT}
      DB_USER: ${OMNIA_WALLET_DB_USER}
      DB_PASSWORD: ${OMNIA_WALLET_DB_PASSWORD}
      DB_NAME: ${OMNIA_WALLET_DB_NAME}
      DB_SSL_CA_PATH: /app/certs/db-ca.crt
      HELIUS_RPC_URL: ${HELIUS_RPC_URL}
      HELIUS_WS_URL: ${HELIUS_WS_URL}
      HELIUS_API_KEY: ${HELIUS_API_KEY}
      JUPITER_API_KEY: ${JUPITER_API_KEY}
      WALLET_APP_URL: ${WALLET_APP_URL}
    networks:
      - app
      - data

  redis-dev:
    image: redis:7-alpine
    container_name: spectre-redis-dev
    ports:
      - "6379:6379"
    networks:
      - data

networks:
  app: {}
  data: {}